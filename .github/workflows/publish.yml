name: Publish to npm

# Main-only. Manual runs rehearse; an eligible push needs NPM_PUBLISH=true.
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

defaults:
  run:
    shell: bash


permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  PACKAGE: '@brotskyllc/react-data-table'
  REGISTRY: 'https://registry.npmjs.org'

jobs:
  verify:
    if: github.repository_id == '1398583274' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: bun test
      - name: Audit the release tarball and smoke-test it as a dependency
        run: |
          release_dir="$RUNNER_TEMP/react-data-table-release"
          node scripts/prepare-npm-release.mjs "$release_dir"
          PACKAGE_SPEC="file:$release_dir/package.tgz" npm run test:consumer
      - name: Rehearse publishing offline without uploading to npm
        run: |
          # An empty offline cache makes this an artifact rehearsal, even for
          # an existing version; the real job independently queries npm.
          npm publish "$RUNNER_TEMP/react-data-table-release/package.tgz" \
            --dry-run --offline --cache "$(mktemp -d)" --ignore-scripts \
            --access public --registry "$REGISTRY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && vars.NPM_PUBLISH == 'true'
        with:
          name: audited-npm-release
          path: ${{ runner.temp }}/react-data-table-release/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.repository_id == '1398583274' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.NPM_PUBLISH == 'true'
    # npm supports OIDC trusted publishing from GitHub-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify npm supports trusted publishing
        run: |
          npm --version | node -e '
            const v = require("node:fs").readFileSync(0, "utf8").trim();
            const parts = /^(\d+)\.(\d+)\.(\d+)$/.exec(v);
            if (!parts) throw new Error("Expected an npm release version");
            const [, major, minor, patch] = parts.map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error("npm 11.5.1 or newer is required for trusted publishing");
            }
            console.log("npm " + v);
          '
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: audited-npm-release
          path: ${{ runner.temp }}/react-data-table-release
      - name: Publish only if the audited version is not on npm
        run: |
          tarball="$RUNNER_TEMP/react-data-table-release/package.tgz"
          version="$(tar -xOzf "$tarball" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (pkg.name !== process.env.PACKAGE ||
                pkg.repository?.url !== "https://github.com/AEGIS-Security-Investigations/react-data-table.git" ||
                !/^\d+\.\d+\.\d+$/.test(pkg.version)) {
              throw new Error("Unexpected package name, repository, or stable version");
            }
            console.log(pkg.version);
          ')"

          # This package already exists on npm. Network errors, authorization
          # failures, and an empty or invalid package response all stop release.
          versions="$(npm view "$PACKAGE" versions --json --prefer-online --registry "$REGISTRY" --fetch-retries=0)"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<<"$versions" >/dev/null; then
            echo "::error::Expected a non-empty version list from the public npm registry."
            exit 1
          fi
          if jq -e --arg version "$version" 'index($version) != null' <<<"$versions" >/dev/null; then
            echo "$PACKAGE@$version is already published; nothing to do."
            exit 0
          fi
          npm publish "$tarball" --ignore-scripts --access public --registry "$REGISTRY"
